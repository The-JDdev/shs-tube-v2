plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.shslab.shstube'
    compileSdk 35

    defaultConfig {
        applicationId "com.shslab.shstube"
        minSdk 24
        targetSdk 35
        versionCode 39
        versionName "2.6.0"
        vectorDrawables.useSupportLibrary = true

        // armv7a APK build
        ndk {
            abiFilters 'armeabi-v7a'
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    "room.schemaLocation": "$projectDir/schemas".toString(),
                    "room.incremental"   : "true"
                ]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // FIX for NewPipe NoSuchMethodError on URLEncoder.encode(String, Charset) on API < 33
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module',
                'META-INF/INDEX.LIST',
                'META-INF/io.netty.versions.properties'
            ]
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Core library desugaring - provides modern java.* APIs on old Android
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Core AndroidX
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.6'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    // Thumbnail image loading
    implementation 'io.coil-kt:coil:2.7.0'

    // Room - persistent download history (SQLite)
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    kapt 'androidx.room:room-compiler:2.7.1'

    // Coroutines + networking
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // youtubedl-android: yt-dlp packaged as AAR
    // 0.18.1 bundles latest yt-dlp 2026.x with PO token fixes + anti-bot workarounds
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

    // libtorrent4j - universal: all 4 ABIs
    implementation 'org.libtorrent4j:libtorrent4j:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-x86:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-x86_64:2.1.0-39'

    // NewPipe Extractor - v0.24.6 fixes YouTube search (ContentNotAvailableException, Deblocking)
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.24.6'

    // Media3 ExoPlayer
    implementation 'androidx.media3:media3-exoplayer:1.7.1'
    implementation 'androidx.media3:media3-ui:1.7.1'
}
